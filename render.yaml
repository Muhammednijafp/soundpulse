services:
  # SoundPulse Django backend — deploy the SERVER repo (manage.py at repo root)
  # Render dashboard equivalent:
  #   Build:   chmod +x build.sh && ./build.sh
  #   Start:   gunicorn soundpulse.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --workers 2 --threads 4
  - type: web
    name: soundpulse-api
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn soundpulse.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --workers 2 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: sqlite
      - key: ALLOWED_HOSTS
        value: "*,.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: https://soundpulse-client-1.vercel.app,http://localhost:3000,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://soundpulse-client-1.vercel.app,https://*.vercel.app,https://*.onrender.com
